<!doctype html>
<html lang="ar" dir="rtl">
<head>

  -->
  <script type="importmap">
  {
    "imports": {
      "./js/store.js": "./js/store.js?v=3",
      "./js/utils.js": "./js/utils.js?v=3",
      "./js/map.js": "./js/map.js?v=3",
